name: 🗳️ Mise à jour des données élus

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'élus à générer (vide = tous)"
        required: false
        default: ""
      save_every:
        description: "Sauvegarder tous les N élus (défaut 100)"
        required: false
        default: "100"
  schedule:
    - cron: "0 6 1 * *"

# Prevent overlapping runs from corrupting data
concurrency:
  group: update-elus-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: "📥 Générer les données élus"
        run: |
          FLAGS="--save-every ${{ github.event.inputs.save_every || '100' }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/generate-elus.py $FLAGS

      - name: "📋 Enrichir les métadonnées depuis le CSV"
        run: python scripts/generate-elus.py --enrich-csv-only

      - name: "💾 Commit intermédiaire"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/elus.json
          git add -f public/data/elus/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            COUNT=$(python3 -c "import json; d=json.load(open('public/data/elus.json')); print(len(d))")
            git commit -m "🗳️ Checkpoint données — $(date -u +'%H:%M UTC') (${COUNT} élus)"
            git pull --rebase
            git push
            echo "::notice ::💾 Checkpoint commité (${COUNT} élus)"
          fi

      - name: "📂 Réorganiser les données (slim elus.json + fichiers individuels)"
        run: python scripts/generate-elus.py --reorganize

      - name: "🔍 Vérifier les changements"
        id: check_changes
        run: |
          # Stage everything to detect both modified AND new files
          git add public/data/elus.json 2>/dev/null || true
          git add -f public/data/elus/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            COUNT=$(python3 -c "import json; d=json.load(open('public/data/elus.json')); print(len(d))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: "🚀 Commit et push"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +"%Y-%m-%d")
          COUNT=${{ steps.check_changes.outputs.count }}
          # Files already staged by check_changes step
          git commit -m "🗳️ Mise à jour données élus — ${DATE} (${COUNT} élus)"
          git pull --rebase
          git push

      - name: "📊 Résumé"
        if: always()
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "## ✅ Données mises à jour" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Élus générés** : ${{ steps.check_changes.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Date** : $(date -u +"%Y-%m-%d %H:%M UTC")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ℹ️ Aucun changement détecté" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Les données sont déjà à jour." >> "$GITHUB_STEP_SUMMARY"
          fi
