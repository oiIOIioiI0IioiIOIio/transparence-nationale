name: 📥 Extraction des données élus

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source des données"
        required: true
        type: choice
        options:
          - "xml"
          - "pdf"
      limit:
        description: "Nombre d'élus à traiter (vide = tous)"
        required: false
        default: ""
      save_every:
        description: "Sauvegarder tous les N élus (défaut 100)"
        required: false
        default: "100"

# Prevent overlapping runs from corrupting data
concurrency:
  group: extraction-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances Python
        run: pip install -r scripts/requirements.txt

      - name: Installer Tesseract OCR (si PDF)
        if: github.event.inputs.source == 'pdf'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra poppler-utils

      # ══════════════════════════════════════════════════════════════════
      # Mode XML — Télécharge et parse le XML global HATVP
      # ══════════════════════════════════════════════════════════════════
      - name: "📥 Extraction depuis le XML global"
        if: github.event.inputs.source == 'xml'
        run: |
          FLAGS="--refresh-xml --save-every ${{ github.event.inputs.save_every || '100' }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/generate-elus.py $FLAGS

      - name: "📋 Enrichir les métadonnées depuis le CSV"
        if: github.event.inputs.source == 'xml'
        run: python scripts/generate-elus.py --enrich-csv-only

      - name: "💾 Commit intermédiaire XML"
        if: github.event.inputs.source == 'xml'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/elus.json
          git add -f public/data/elus/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            COUNT=$(python3 -c "import json; d=json.load(open('public/data/elus.json')); print(len(d))")
            git commit -m "🗳️ Checkpoint XML — $(date -u +'%H:%M UTC') (${COUNT} élus)"
            git pull --rebase
            git push
            echo "::notice ::💾 Checkpoint XML commité (${COUNT} élus)"
          fi

      # ══════════════════════════════════════════════════════════════════
      # Mode PDF — OCR des déclarations PDF
      # ══════════════════════════════════════════════════════════════════
      - name: "📄 Traiter les PDFs via OCR"
        if: github.event.inputs.source == 'pdf'
        run: |
          FLAGS="--batch --save-every ${{ github.event.inputs.save_every || '100' }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/parse_pdf.py $FLAGS

      - name: "📄 Traiter les PDFs locaux (public/*.pdf)"
        if: github.event.inputs.source == 'pdf'
        run: |
          for pdf in public/*.pdf; do
            [ -f "$pdf" ] || continue
            echo "📄 Traitement : $pdf"
            python scripts/parse_pdf.py --process-local "$pdf"
          done

      - name: "🔗 Merger les données PDF dans elus.json"
        if: github.event.inputs.source == 'pdf'
        run: python scripts/parse_pdf.py --merge-to-main

      - name: "💾 Commit intermédiaire PDF"
        if: github.event.inputs.source == 'pdf'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/elus.json
          git add public/data/pdf_declarations/ 2>/dev/null || true
          git add -f public/data/elus/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            COUNT=$(python3 -c "import json; d=json.load(open('public/data/elus.json')); print(len(d))")
            git commit -m "📄 Checkpoint PDF — $(date -u +'%H:%M UTC') (${COUNT} élus)"
            git pull --rebase
            git push
            echo "::notice ::💾 Checkpoint PDF commité (${COUNT} élus)"
          fi

      # ══════════════════════════════════════════════════════════════════
      # Réorganisation + Commit final
      # ══════════════════════════════════════════════════════════════════
      - name: "📂 Réorganiser les données (slim elus.json + fichiers individuels)"
        run: python scripts/generate-elus.py --reorganize

      - name: "🔍 Vérifier les changements"
        id: check_changes
        run: |
          git add public/data/elus.json 2>/dev/null || true
          git add public/data/pdf_declarations/ 2>/dev/null || true
          git add -f public/data/elus/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            COUNT=$(python3 -c "import json; d=json.load(open('public/data/elus.json')); print(len(d))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: "🚀 Commit et push"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +"%Y-%m-%d")
          COUNT=${{ steps.check_changes.outputs.count }}
          SOURCE=${{ github.event.inputs.source }}
          git commit -m "📥 Extraction ${SOURCE^^} — ${DATE} (${COUNT} élus)"
          git pull --rebase
          git push

      - name: "📊 Résumé"
        if: always()
        run: |
          SOURCE=${{ github.event.inputs.source }}
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "## ✅ Données mises à jour" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source** : ${SOURCE^^}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Élus** : ${{ steps.check_changes.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Date** : $(date -u +"%Y-%m-%d %H:%M UTC")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ℹ️ Aucun changement détecté" >> "$GITHUB_STEP_SUMMARY"
          fi
